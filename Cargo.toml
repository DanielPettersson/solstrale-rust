[package]
name = "solstrale"
description = "A Path tracing library"
version = "0.1.11"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/DanielPettersson/solstrale-rust"
keywords = ["Pathtracing", "Graphics"]
exclude = [
    "resources/*",
    "oidn/*"
]

[features]
oidn-postprocessor = ["dep:oidn"]

[profile.release]
lto = true
codegen-units = 1
debug = 1

[dependencies]
fastrand = "2.3.0"
image = "0.25.8"
simple-error = "0.3.2"
enum_dispatch = "0.3.13"
tobj = "4.0.3"
oidn = { version = "2.3.3", optional = true }
derive_more = { version = "2.0.1", features = ["constructor", "display"] }
rayon = "1.11.0"
bytemuck = "1.24.0"
pollster = "0.4.0"
wgpu = "27.0.1"

[dev-dependencies]
image-compare = "0.5.0"
criterion = "0.7.0"

[[bench]]
name = "solstrale_benchmark"
harness = false