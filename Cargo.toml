[package]
name = "solstrale"
description = "A Path tracing library"
version = "0.1.11"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/DanielPettersson/solstrale-rust"
keywords = ["Pathtracing", "Graphics"]
exclude = [
    "resources/*",
    "oidn/*"
]

[features]
oidn-postprocessor = ["oidn"]
gpu = ["wgpu", "pollster", "bytemuck"]

default = ["gpu"]

[profile.release]
lto = true
codegen-units = 1
debug = 1

[dependencies]
fastrand = "2.3.0"
image = "0.25.8"
simple-error = "0.3.2"
enum_dispatch = "0.3.13"
tobj = "4.0.3"
oidn = { version = "2.3.3", optional = true }
derive_more = { version = "2.0.1", features = ["constructor", "display"] }
rayon = "1.11.0"
bytemuck = { version = "1.24.0", optional = true }
pollster = { version = "0.4.0", optional = true }
wgpu = { version = "27.0.1", optional = true }
once_cell = "1.21.3"

[dev-dependencies]
image-compare = "0.5.0"
criterion = "0.7.0"

[[bench]]
name = "solstrale_benchmark"
harness = false